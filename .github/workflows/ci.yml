name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  resident-clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/resident-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/resident-web/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm test
      - run: npm run build
      - name: Validate WeChat application source
        working-directory: apps/resident-miniapp
        run: |
          find . -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "const fs=require('fs'); for(const p of fs.readdirSync('.', {recursive:true}).filter(p=>p.endsWith('.json'))) JSON.parse(fs.readFileSync(p, 'utf8'))"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
